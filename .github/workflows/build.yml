name: Build & publish to itch.io

# On every push to main: WebGL build with Unity, pushed to itch.io with butler.
# Secrets needed: UNITY_LICENSE (whole content of C:/ProgramData/Unity/Unity_lic.ulf),
# UNITY_EMAIL, UNITY_PASSWORD, BUTLER_API_KEY.
# Edit ITCH_USER / ITCH_GAME below to match the itch.io project.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.3.16f1
  ITCH_USER: ${{ vars.ITCH_USER }}
  ITCH_GAME: ${{ vars.ITCH_GAME }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildName: EcosDelAzar

      - uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_USER: ${{ env.ITCH_USER }}
          ITCH_GAME: ${{ env.ITCH_GAME }}
          PACKAGE: build/WebGL/EcosDelAzar
